name: 📊 Performance Monthly

# 성과 루프(P0) — 토요일 단일 배치: 최근 30일 수집 → 커밋 → 월간 성적표 전송.
# 수집·리포트를 2개 잡으로 나누면 수집 지연 시 리포트가 먼저 도는 레이스가
# 생기므로 하나로 통일. 한 잡이라 순서는 항상 보장된다.
# - 수집: 예약 17:55 기준 최근 30일 공개분 항상 덮어쓰기 (공개일~현재 누적)
# - 커밋: history/performance.json만 (변경 없으면 스킵)
# - 리포트: 같은 잡의 로컬 최신 performance.json으로 바로 전송
# - 실수집에는 YOUTUBE_REFRESH_TOKEN 재동의(yt-analytics.readonly) 필요.
#   재동의 전에는 수집이 빈손으로 끝나고 리포트는 "수집 데이터 없음" 안내.

on:
  schedule:
    - cron: '0 20 * * 5' # 토요일 오전 5시 (KST)

  workflow_dispatch:

permissions:
  contents: write

env:
  YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
  YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
  YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
  # 성적 읽기 전용 클라이언트 조 (업로드용과 완전 분리, 없으면 업로드용으로 폴백)
  YOUTUBE_ANALYTICS_CLIENT_ID: ${{ secrets.YOUTUBE_ANALYTICS_CLIENT_ID }}
  YOUTUBE_ANALYTICS_CLIENT_SECRET: ${{ secrets.YOUTUBE_ANALYTICS_CLIENT_SECRET }}
  YOUTUBE_ANALYTICS_REFRESH_TOKEN: ${{ secrets.YOUTUBE_ANALYTICS_REFRESH_TOKEN }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  performance-monthly:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 📊 Collect performance
        run: |
          cd scripts
          python analytics_collector.py --collect

      - name: 📝 Commit performance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history/performance.json
          git diff --staged --quiet && echo "ℹ️ 변경 없음 (수집 0건 또는 재동의 전)" || git commit -m "📊 Update performance $(date +%Y-%m-%d)"
          git pull --rebase origin main || true
          git push || echo "⚠️ Push 실패 (다음 스케줄에 재시도)"

      - name: 📊 Send monthly report
        run: |
          cd scripts
          python monthly_report.py --send
